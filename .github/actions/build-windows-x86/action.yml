name: Build Windows x86 Release
description: Build, test, install and package SteamAppsLocation.

outputs:
  archive-path:
    description: Absolute path to the Windows x86 7z archive.
    value: ${{ steps.package.outputs.archive-path }}

runs:
  using: composite
  steps:
    - name: Build, test and install
      shell: cmd
      run: call scripts\build-SteamAppsLocation-x86-Release.bat

    - name: Package program
      id: package
      shell: pwsh
      working-directory: install/x86/Release
      run: |
        $archiveDirectory = Join-Path $env:GITHUB_WORKSPACE 'build/artifacts'
        New-Item -ItemType Directory -Path $archiveDirectory -Force | Out-Null
        $archivePath = Join-Path $archiveDirectory 'SteamAppsLocation-windows-x86.7z'
        if (Test-Path -LiteralPath $archivePath -PathType Leaf) {
          Remove-Item -LiteralPath $archivePath
        }
        & 7z a -t7z $archivePath 'SteamAppsLocation.exe' 'SteamAppsLocation.pdb' 'steam_api.dll' 'README.md' 'LICENSE' 'STEAM-SDK-NOTICE.md'
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        & 7z t $archivePath
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        "archive-path=$archivePath" >> $env:GITHUB_OUTPUT
